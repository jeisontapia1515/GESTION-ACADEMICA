<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión | Decanatura de Investigación - ESFIM</title>
  <meta name="description" content="Sistema de Gestión y Seguimiento Académico de la Decanatura de Investigación - Escuela de Formación de Infantería de Marina." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  
  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b1120" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ESFIM Investigación" />
  <link rel="apple-touch-icon" href="/img/logo.png" />
  <link rel="icon" type="image/png" href="/img/logo.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; height: 100%; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1120;
      background-image:
        radial-gradient(at 20% 10%, rgba(59, 130, 246, 0.18) 0px, transparent 55%),
        radial-gradient(at 80% 5%, rgba(6, 182, 212, 0.12) 0px, transparent 50%),
        radial-gradient(at 50% 90%, rgba(139, 92, 246, 0.10) 0px, transparent 50%);
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    /* Animated background orbs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      animation: orb-float 8s ease-in-out infinite;
      pointer-events: none;
    }
    body::before {
      width: 500px; height: 500px;
      background: rgba(59, 130, 246, 0.07);
      top: -150px; left: -100px;
    }
    body::after {
      width: 400px; height: 400px;
      background: rgba(139, 92, 246, 0.06);
      bottom: -100px; right: -100px;
      animation-delay: -4s;
    }
    @keyframes orb-float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }

    /* ── Login Card ── */
    .login-card {
      width: 100%;
      max-width: 440px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.12);
      border-radius: 24px;
      padding: 2.5rem 2.25rem 2rem;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      animation: card-enter 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes card-enter {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Logo ── */
    .login-logo-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
      margin-bottom: 1.75rem;
    }
    .login-logo-icon {
      width: 72px; height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #1e40af, #3b82f6, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4), 0 0 0 1px rgba(59,130,246,0.2);
    }
    .login-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #f8fafc;
      letter-spacing: -0.03em;
      text-align: center;
      line-height: 1.2;
    }
    .login-subtitle {
      font-size: 0.82rem;
      color: #64748b;
      text-align: center;
      margin-top: 0.2rem;
    }
    .badge-efim {
      display: inline-block;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 0.2rem 0.65rem;
      border-radius: 99px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 0.25rem;
    }

    /* ── Form ── */
    .login-form { display: flex; flex-direction: column; gap: 1rem; }

    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .input-wrapper { position: relative; }
    .input-icon {
      position: absolute;
      left: 1rem; top: 50%;
      transform: translateY(-50%);
      color: #475569;
      font-size: 1rem;
      pointer-events: none;
    }
    .form-input {
      width: 100%;
      padding: 0.8rem 1rem 0.8rem 2.75rem;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 12px;
      color: #f8fafc;
      font-family: inherit;
      font-size: 0.93rem;
      font-weight: 500;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .form-input::placeholder { color: #475569; }
    .form-input:focus {
      border-color: #3b82f6;
      background: rgba(30, 41, 59, 1);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .form-input.error { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1); }

    .toggle-password {
      position: absolute;
      right: 1rem; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: #475569; cursor: pointer;
      font-size: 1rem;
      transition: color 0.2s;
      padding: 0.25rem;
    }
    .toggle-password:hover { color: #94a3b8; }

    /* Error message */
    .error-msg {
      display: none;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 10px;
      padding: 0.7rem 1rem;
      color: #fca5a5;
      font-size: 0.83rem;
      font-weight: 500;
      align-items: center;
      gap: 0.5rem;
    }
    .error-msg.show { display: flex; }

    /* Inactivity Notice */
    .notice-msg {
      display: none;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      color: #fde68a;
      font-size: 0.83rem;
      font-weight: 500;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.25rem;
      line-height: 1.35;
    }
    .notice-msg.show { display: flex; }

    /* Submit Button */
    .btn-login {
      margin-top: 0.5rem;
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);
      position: relative;
      overflow: hidden;
    }
    .btn-login::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent, rgba(255,255,255,0.08));
      opacity: 0;
      transition: opacity 0.2s;
    }
    .btn-login:hover:not(:disabled)::after { opacity: 1; }
    .btn-login:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.45);
    }
    .btn-login:active:not(:disabled) { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-login .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-login.loading .btn-text { display: none; }
    .btn-login.loading .spinner { display: block; }

    /* Footer */
    .login-footer {
      margin-top: 1.5rem;
      text-align: center;
      color: #334155;
      font-size: 0.74rem;
    }
    .login-footer strong { color: #475569; }

    /* Responsive */
    @media (max-width: 480px) {
      .login-card { padding: 1.75rem 1.25rem 1.5rem; border-radius: 20px; }
      .login-title { font-size: 1.15rem; }
    }
  </style>
</head>
<body>
  <div class="login-card" role="main">
    <!-- Logo Institucional Oficial -->
    <div class="login-logo-wrap">
      <img src="/img/logo.png" alt="Decanatura de Investigación ESFIM" class="login-logo-img" style="width: 105px; height: 105px; object-fit: contain; filter: drop-shadow(0 6px 20px rgba(0,0,0,0.45)); margin-bottom: 0.65rem;" />
      <div>
        <h1 class="login-title">Decanatura de Investigación</h1>
        <p class="login-subtitle">Escuela de Formación de Infantería de Marina</p>
        <div style="text-align:center; margin-top: 0.4rem;">
          <span class="badge-efim">ESFIM · Sistema Académico</span>
        </div>
      </div>
    </div>

    <!-- Inactivity Notice -->
    <div id="loginNotice" class="notice-msg" role="status">
      <span>⏱️</span>
      <span id="loginNoticeText">Tu sesión se ha cerrado por seguridad tras 5 minutos de inactividad.</span>
    </div>

    <!-- Error Message -->
    <div id="loginError" class="error-msg" role="alert">
      <span>⚠️</span>
      <span id="loginErrorText">Credenciales incorrectas.</span>
    </div>

    <!-- Form -->
    <form id="loginForm" class="login-form" autocomplete="on" novalidate>
      <div class="form-group">
        <label class="form-label" for="loginEmail">Correo Institucional</label>
        <div class="input-wrapper">
          <span class="input-icon">📧</span>
          <input
            id="loginEmail"
            type="email"
            class="form-input"
            placeholder="nombre@esfim.edu.co"
            autocomplete="email"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="loginPassword">Contraseña</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            id="loginPassword"
            type="password"
            class="form-input"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
          <button type="button" class="toggle-password" id="togglePwd" aria-label="Mostrar contraseña">👁️</button>
        </div>
      </div>

      <button type="submit" id="btnLogin" class="btn-login">
        <div class="spinner"></div>
        <span class="btn-text">🔑 Iniciar Sesión</span>
      </button>
    </form>

    <!-- Footer -->
    <div class="login-footer">
      <strong>Sistema de Gestión</strong><br />
      Decanatura de Investigación · ESFIM &nbsp;©&nbsp;2026
    </div>
  </div>

  <script>
    // Toggle password visibility
    document.getElementById('togglePwd').addEventListener('click', function () {
      const pwd = document.getElementById('loginPassword');
      const isText = pwd.type === 'text';
      pwd.type = isText ? 'password' : 'text';
      this.textContent = isText ? '👁️' : '🙈';
    });

    // Login form submission
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('btnLogin');
      const errorDiv = document.getElementById('loginError');
      const errorText = document.getElementById('loginErrorText');

      errorDiv.classList.remove('show');
      document.getElementById('loginEmail').classList.remove('error');
      document.getElementById('loginPassword').classList.remove('error');

      if (!email || !password) {
        errorText.textContent = 'Por favor complete todos los campos.';
        errorDiv.classList.add('show');
        if (!email) document.getElementById('loginEmail').classList.add('error');
        if (!password) document.getElementById('loginPassword').classList.add('error');
        return;
      }

      btn.classList.add('loading');
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (data.success) {
          const nowTs = String(Date.now());
          // Store token and user in sessionStorage (tab-isolated) and localStorage
          sessionStorage.setItem('efim_token', data.token);
          sessionStorage.setItem('efim_user', JSON.stringify(data.user));
          sessionStorage.setItem('efim_last_activity', nowTs);
          localStorage.setItem('efim_token', data.token);
          localStorage.setItem('efim_user', JSON.stringify(data.user));
          localStorage.setItem('efim_last_activity', nowTs);

          // Show brief success flash then redirect
          btn.innerHTML = '<span class="btn-text">✅ Acceso autorizado...</span>';
          setTimeout(() => { window.location.href = '/app'; }, 600);
        } else {
          errorText.textContent = data.message || 'Credenciales incorrectas. Verifique su correo y contraseña.';
          errorDiv.classList.add('show');
          document.getElementById('loginPassword').classList.add('error');
          btn.classList.remove('loading');
          btn.disabled = false;
        }
      } catch (err) {
        errorText.textContent = 'No se pudo conectar con el servidor. Intente de nuevo.';
        errorDiv.classList.add('show');
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    });

    // Check if redirected due to inactivity
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('expired') === '1') {
      const noticeDiv = document.getElementById('loginNotice');
      if (noticeDiv) noticeDiv.classList.add('show');
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    // Verify existing session against 5m inactivity timeout
    const INACTIVITY_TIMEOUT_MS = 5 * 60 * 1000;
    const existingToken = sessionStorage.getItem('efim_token') || localStorage.getItem('efim_token');
    const lastActivity = sessionStorage.getItem('efim_last_activity') || localStorage.getItem('efim_last_activity');
    const now = Date.now();

    function clearSession() {
      sessionStorage.removeItem('efim_token');
      sessionStorage.removeItem('efim_user');
      sessionStorage.removeItem('efim_last_activity');
      localStorage.removeItem('efim_token');
      localStorage.removeItem('efim_user');
      localStorage.removeItem('efim_last_activity');
    }

    if (existingToken && lastActivity && (now - parseInt(lastActivity, 10)) <= INACTIVITY_TIMEOUT_MS) {
      fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + existingToken } })
        .then(r => r.json())
        .then(d => {
          if (d.success) {
            const nowTs = String(Date.now());
            sessionStorage.setItem('efim_last_activity', nowTs);
            localStorage.setItem('efim_last_activity', nowTs);
            window.location.href = '/app';
          } else {
            clearSession();
          }
        })
        .catch(() => {});
    } else {
      clearSession();
    }

    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.warn('SW registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
