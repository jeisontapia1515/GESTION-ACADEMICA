<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#091428"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#3b82f6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Military Shield outline -->
  <path d="M 256 60 L 390 120 C 390 280 256 420 256 420 C 256 420 122 280 122 120 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#glow)"/>

  <!-- Naval Anchor in center -->
  <!-- Top Ring -->
  <circle cx="256" cy="145" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="12"/>
  <circle cx="256" cy="145" r="10" fill="#0b1120"/>
  
  <!-- Cross bar -->
  <rect x="190" y="180" width="132" height="18" rx="9" fill="url(#goldGrad)"/>
  <circle cx="190" cy="189" r="12" fill="url(#goldGrad)"/>
  <circle cx="322" cy="189" r="12" fill="url(#goldGrad)"/>

  <!-- Vertical Shaft -->
  <rect x="246" y="165" width="20" height="160" rx="6" fill="url(#goldGrad)"/>

  <!-- Curved Flukes / Arms -->
  <path d="M 160 270 C 160 360 352 360 352 270" fill="none" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round"/>
  
  <!-- Anchor Arrowheads / Palms -->
  <polygon points="144,272 176,272 160,240" fill="url(#goldGrad)"/>
  <polygon points="336,272 368,272 352,240" fill="url(#goldGrad)"/>

  <!-- Bottom Tip -->
  <circle cx="256" cy="336" r="12" fill="url(#goldGrad)"/>

  <!-- Text: ESFIM DECANATURA -->
  <text x="256" y="465" font-family="'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">ESFIM</text>
  <text x="256" y="492" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#93c5fd" text-anchor="middle" letter-spacing="2">INVESTIGACIÓN</text>
</svg>
